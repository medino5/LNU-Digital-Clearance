services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clearance_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - mysql
    networks:
      - clearance_network

  nginx:
    image: nginx:alpine
    container_name: clearance_nginx
    ports:
      - "8000:80"  # Exposed to LAN for physical device testing
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - clearance_network

  mysql:
    image: mysql:8.0
    container_name: clearance_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - clearance_network

networks:
  clearance_network:
    driver: bridge

volumes:
  mysql_data:
