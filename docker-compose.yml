version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clearance_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - mysql
    networks:
      - clearance_network

  nginx:
    image: nginx:alpine
    container_name: clearance_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - clearance_network

  mysql:
    image: mysql:8.0
    container_name: clearance_mysql
    environment:
      MYSQL_DATABASE: clearance_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: clearance_user
      MYSQL_PASSWORD: root
    networks:
      - clearance_network

networks:
  clearance_network:
    driver: bridge